services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: takeoff-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    expose:
      - "8000"
    volumes:
      # Mount client_files for optional backward compatibility (not required)
      - ./client_files:/app/client_files
      # Mount outputs so predictions persist on host
      - ./outputs:/app/outputs
      # Mount data directory
      - ./data:/app/data
      # Mount project files from temp extraction
      - /tmp/new_project_extracted:/tmp/new_project_extracted
      # Persist app state files
      - ./api/dynamic_config.json:/app/api/dynamic_config.json
      - ./api/jobs_history.json:/app/api/jobs_history.json
      - ./api/registered_projects.json:/app/api/registered_projects.json
      - ./api/hidden_projects.json:/app/api/hidden_projects.json
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PYTHONPATH=/app
    networks:
      - takeoff-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: takeoff-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - takeoff-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  takeoff-network:
    driver: bridge
